<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="星海露营夜里帐篷前的两个人">
  <defs>
    <linearGradient id="skyCamp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2347"/>
      <stop offset=".36" stop-color="#3b3b6b"/>
      <stop offset=".66" stop-color="#67538a"/>
      <stop offset="1" stop-color="#a27b9b"/>
    </linearGradient>
    <radialGradient id="milky" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f4dcff" stop-opacity=".38"/>
      <stop offset=".6" stop-color="#cdb8ff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#cdb8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mtnCamp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f3c68"/>
      <stop offset="1" stop-color="#262643"/>
    </linearGradient>
    <linearGradient id="groundCamp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#353856"/>
      <stop offset="1" stop-color="#20233a"/>
    </linearGradient>
    <linearGradient id="tentCamp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d7cd"/>
      <stop offset="1" stop-color="#d9b8be"/>
    </linearGradient>
    <radialGradient id="fireCamp" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe5a7" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#ffc37f" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffb36b" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurCamp" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect width="800" height="600" fill="url(#skyCamp)"/>
  <ellipse cx="390" cy="220" rx="380" ry="148" fill="url(#milky)" transform="rotate(-16 390 220)"/>
  <g fill="#fff" opacity=".9">
    <circle cx="95" cy="84" r="1.6"/><circle cx="162" cy="147" r="1.2"/><circle cx="226" cy="63" r="1.8"/>
    <circle cx="309" cy="108" r="1.1"/><circle cx="380" cy="55" r="1.5"/><circle cx="451" cy="130" r="1.2"/>
    <circle cx="534" cy="72" r="1.7"/><circle cx="622" cy="133" r="1.3"/><circle cx="711" cy="58" r="1.5"/>
    <circle cx="762" cy="165" r="1.1"/><circle cx="63" cy="215" r="1.2"/><circle cx="279" cy="192" r="1.4"/>
    <circle cx="674" cy="214" r="1.1"/><circle cx="537" cy="190" r="1.5"/><circle cx="407" cy="204" r="1"/>
    <circle cx="180" cy="240" r="1.3"/><circle cx="741" cy="266" r="1.2"/><circle cx="588" cy="255" r="1"/>
  </g>
  <g fill="#d9c7ff" opacity=".7">
    <path d="M466 75l2.4 7.4 7.4 2.4-7.4 2.4-2.4 7.4-2.4-7.4-7.4-2.4 7.4-2.4z"/>
    <path d="M145 205l1.8 5.7 5.7 1.8-5.7 1.8-1.8 5.7-1.8-5.7-5.7-1.8 5.7-1.8z"/>
    <circle cx="288" cy="143" r="2"/>
  </g>
  <g fill="#fff" opacity=".45">
    <path d="M346 148c13-9 23-9 33 0-11 8-22 8-33 0z" fill="#e9ddff"/>
  </g>

  <!-- shooting star -->
  <path d="M570 96l-92 44" stroke="#fff4dc" stroke-width="2" stroke-linecap="round" opacity=".65"/>
  <circle cx="571" cy="95" r="2.4" fill="#fff8e4"/>

  <!-- mountains -->
  <path d="M0 356l88-116 64 79 58-42 92 106 87-79 84 73 75-115 86 132 66-61 100 90v90H0z" fill="url(#mtnCamp)" opacity=".92"/>
  <path d="M0 400l73-58 56 48 60-28 77 55 71-35 79 53 84-58 90 61 68-42 82 54 60-31v80H0z" fill="#2e2d4d" opacity=".9"/>
  <path d="M0 432c121-25 219-12 323 9 110 22 208 20 309-8 65-18 120-18 168-8v175H0z" fill="url(#groundCamp)"/>
  <path d="M0 459c122-22 221-11 323 8 108 20 206 19 308-7 64-16 120-17 169-7v46c-94-17-177-11-260 7-101 21-202 18-302-2C136 486 69 487 0 505z" fill="#424663" opacity=".5"/>

  <!-- lake -->
  <path d="M0 470c102-16 209-9 303 9 96 19 199 17 301-4 69-15 134-15 196-4v58c-95-16-181-9-265 8-99 20-198 17-298-2C154 523 75 523 0 538z" fill="#3e4166" opacity=".6"/>
  <g stroke="#b9b1dd" stroke-width="1.2" opacity=".5" stroke-linecap="round">
    <path d="M74 507h48M152 521h33M261 510h55M389 529h41M531 514h47M652 530h38M724 508h35"/>
  </g>
  <g fill="#fff" opacity=".6">
    <circle cx="104" cy="530" r="1.2"/><circle cx="478" cy="542" r="1"/><circle cx="698" cy="548" r="1.3"/>
  </g>

  <!-- tent -->
  <g transform="translate(274 400)">
    <path d="M-32 138c-36-2-65-20-78-50L-16-34c9-20 45-20 55 0L146 88c-13 30-43 48-79 50z" fill="url(#tentCamp)" stroke="#a9878d" stroke-width="3"/>
    <path d="M0-31c11 0 20 7 25 17l76 152H-101L-25-14C-20-24-11-31 0-31z" fill="#f8e7dc" opacity=".5"/>
    <path d="M0 1v137" stroke="#b8989c" stroke-width="2.4"/>
    <path d="M-54 138l20-97c7-31 61-31 68 0l20 97z" fill="#5a4b70" opacity=".8"/>
    <path d="M-27 138l11-72c2-12 10-20 16-20s14 8 16 20l11 72z" fill="#ffe6b1" stroke="#d3a98c" stroke-width="2"/>
    <path d="M0 61c11 8 19 27 22 77H-22c3-50 11-69 22-77z" fill="#fff2c9" opacity=".7"/>
    <path d="M-75-5l-31 97M75-5l31 97" stroke="#b8989c" stroke-width="2" opacity=".75"/>
    <circle cx="0" cy="-46" r="5" fill="#f6d7a8"/>
    <path d="M0-41v-25" stroke="#b8989c" stroke-width="2"/>
    <path d="M0-66l18 7-18 8z" fill="#f3c6ce" stroke="#c998a3" stroke-width="1.2"/>
  </g>

  <!-- campfire -->
  <g transform="translate(512 472)">
    <circle cx="0" cy="20" r="98" fill="url(#fireCamp)" opacity=".7"/>
    <path d="M-50 47l18-18M50 47L32 29M-41 31l82 16M-34 52l68-27" stroke="#7b615b" stroke-width="10" stroke-linecap="round"/>
    <path d="M0 49c-17-15-9-32 2-45 3 12 12 20 17 30 6 12-2 26-19 15z" fill="#ffd28c"/>
    <path d="M1 48c-9-9-4-19 2-27 2 7 7 12 9 18 3 7-2 15-11 9z" fill="#fff1bd"/>
    <path d="M-24 54c8 5 16 7 25 7s18-2 25-7" fill="none" stroke="#d9946b" stroke-width="3" stroke-linecap="round"/>
    <g fill="#ffd9a0">
      <circle cx="-8" cy="-26" r="2"/><circle cx="15" cy="-13" r="1.5"/><circle cx="4" cy="-40" r="1.2"/>
    </g>
  </g>

  <!-- two figures sitting -->
  <g transform="translate(378 465)">
    <ellipse cx="0" cy="64" rx="66" ry="13" fill="#1a1b2e" opacity=".4"/>
    <!-- girl -->
    <path d="M-42 62c-12 1-21-7-19-19 2-15 14-25 27-33 5-3 9-1 11 5 6 16 2 33-19 47z" fill="#f0cadc" stroke="#b08da8" stroke-width="2"/>
    <path d="M-44 25c-6-13 2-28 14-30 14-2 24 8 23 22 0 12-9 20-20 20-8 0-13-4-17-12z" fill="#f7dee8" stroke="#b08da8" stroke-width="2"/>
    <path d="M-47 19c-4-21 5-33 20-33 14 0 24 11 23 30-4-9-10-15-17-18-4 6-11 9-19 10-3 0-5 4-7 11z" fill="#b9a0d7"/>
    <path d="M-49 23c-8 17-9 32-3 44M-27 17c-2 18-8 33-17 45" fill="none" stroke="#b9a0d7" stroke-width="7" stroke-linecap="round"/>
    <path d="M-34 4c-1 6 2 9 6 9 3 0 5-3 4-6" fill="none" stroke="#d9acbe" stroke-width="2"/>
    <!-- boy -->
    <path d="M26 61c11 1 19-7 18-19-2-14-12-24-24-31-5-3-9-1-10 4-5 15-1 31 16 46z" fill="#d5dfef" stroke="#8e9bb6" stroke-width="2"/>
    <path d="M30 24c4-13-3-27-15-28-13-1-22 8-21 22 0 11 8 19 18 18 7 0 13-5 18-12z" fill="#f7dee8" stroke="#8e9bb6" stroke-width="2"/>
    <path d="M32 18c3-20-5-32-19-31-13 0-22 11-21 29 4-9 9-14 16-17 4 6 10 9 18 10 3 0 5 3 6 9z" fill="#a7b1c9"/>
    <path d="M33 22c7 16 8 31 3 43M14 17c2 17 7 32 15 44" fill="none" stroke="#a7b1c9" stroke-width="7" stroke-linecap="round"/>
    <path d="M21 3c1 6-2 9-6 9-3 0-5-3-4-6" fill="none" stroke="#d9acbe" stroke-width="2"/>
    <!-- hands / blanket -->
    <path d="M-16 46c11-3 22-3 32 0" fill="none" stroke="#f4dae5" stroke-width="6" stroke-linecap="round"/>
    <path d="M-42 56c28 9 57 9 84 0" fill="none" stroke="#c9a9c2" stroke-width="3" stroke-linecap="round" opacity=".7"/>
    <g fill="#fff" opacity=".8">
      <circle cx="-68" cy="24" r="1.5"/><circle cx="68" cy="39" r="1.2"/>
    </g>
  </g>

  <!-- foreground grass -->
  <g stroke="#5b5f7d" stroke-width="2" stroke-linecap="round" opacity=".7">
    <path d="M35 584c3-17 8-28 16-37M45 585c0-14 3-25 10-35M710 575c4-19 11-31 20-41M722 580c1-16 5-27 12-37"/>
  </g>
  <g fill="#f5c8da" opacity=".7">
    <circle cx="137" cy="553" r="4"/><circle cx="653" cy="540" r="3.5"/><circle cx="596" cy="572" r="3"/>
  </g>
</svg>
